<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="winBg" x1="0" y1="0" x2="0" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12161B"/>
      <stop offset="100%" stop-color="#0B0E12"/>
    </linearGradient>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060809"/>
      <stop offset="100%" stop-color="#0A0D0F"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#00FF88" fill-opacity="0.045"/>
    </pattern>
    <clipPath id="typeClip1">
      <rect x="0" y="0" width="0" height="20">
        <animate attributeName="width" values="0;438;438;438;438" keyTimes="0;0.16;0.5;0.98;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="typeClip2">
      <rect x="0" y="0" width="0" height="20">
        <animate attributeName="width" values="0;0;0;494;494;494;0;0" keyTimes="0;0.16;0.2;0.42;0.7;0.97;0.985;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="320" fill="url(#pageBg)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>

  <!-- terminal window -->
  <g>
    <rect x="60" y="34" width="1080" height="252" rx="10" fill="url(#winBg)" stroke="#22292F" stroke-width="1"/>

    <!-- title bar -->
    <rect x="60" y="34" width="1080" height="38" rx="10" fill="#161B21"/>
    <rect x="60" y="62" width="1080" height="10" fill="#161B21"/>
    <circle cx="86" cy="53" r="6" fill="#FF5F57"/>
    <circle cx="106" cy="53" r="6" fill="#FEBC2E"/>
    <circle cx="126" cy="53" r="6" fill="#28C840"/>
    <text x="600" y="58" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace" font-size="12.5" fill="#6B7680">sanjai@portfolio: ~/build</text>

    <!-- prompt line 1 -->
    <text x="90" y="120" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace" font-size="18" fill="#00FF88">$&#160;</text>
    <text x="112" y="120" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace" font-size="18" fill="#E8EDEB" clip-path="url(#typeClip1)">whoami --role "AI/ML Developer"</text>

    <!-- output block 1 -->
    <text x="90" y="156" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace" font-size="17" font-weight="700" fill="#00FF88">
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.16;0.22;0.95;0.98;1" dur="9s" repeatCount="indefinite"/>
      Sanjai Mohan
    </text>
    <text x="288" y="156" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace" font-size="17" fill="#8A9997">
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.16;0.22;0.95;0.98;1" dur="9s" repeatCount="indefinite"/>
      — final-year B.Tech, AI &amp; Data Science
    </text>

    <!-- prompt line 2 -->
    <text x="90" y="196" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace" font-size="18" fill="#00C2FF">
      <animate attributeName="opacity" values="0;0;0;1;1;1;0;0" keyTimes="0;0.16;0.2;0.22;0.7;0.97;0.985;1" dur="9s" repeatCount="indefinite"/>
      $&#160;
    </text>
    <text x="112" y="196" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace" font-size="18" fill="#E8EDEB" clip-path="url(#typeClip2)">./build.sh --stack "Flask, FastAPI, Next.js, LLaMA3"</text>

    <!-- status line -->
    <text x="90" y="232" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace" font-size="15" fill="#6B7680">
      <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" keyTimes="0;0.16;0.2;0.42;0.5;0.97;0.985;1" dur="9s" repeatCount="indefinite"/>
      &gt;&#160;status: shipped ✓&#160;&#160;&#160;uptime: always building
    </text>

    <!-- blinking cursor -->
    <rect x="90" y="248" width="10" height="18" fill="#00FF88">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="x" values="90;90;90;90;536;536;536;90" keyTimes="0;0.16;0.2;0.22;0.42;0.7;0.97;1" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- footer meta strip -->
  <g font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace" font-size="13.5" fill="#8A9997">
    <circle cx="66" cy="305" r="4" fill="#00FF88"/>
    <text x="78" y="309">Coimbatore, India · UTC+5:30</text>
    <circle cx="330" cy="305" r="4" fill="#00C2FF"/>
    <text x="342" y="309">Open to AI/ML Internships &amp; Placements</text>
  </g>
</svg>
